    <script>
        (function () {

            function go(delta) {

                var yyyymm = String(d.getUTCFullYear()) + String(d.getUTCMonth() + 1).padStart(2, "0");

                window.location.href = currentUrl.origin + "/day/" + yyyymm + "/" + dd + ".html";

                var tag = (document.activeElement && document.activeElement.tagName) || "";
                if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
                if (event.key === "ArrowLeft") go(-1);
                else if (event.key === "ArrowRight") go(1);
                else if (event.key === "Escape") window.location.href = "/";
